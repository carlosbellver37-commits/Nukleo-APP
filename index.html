<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>nukleo.</title>
<meta name="description" content="Panel interno de nukleo: clientes, pipeline, calendario y cobros de membresías.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="nukleo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Strict black & white: ink on paper. State is carried by fill (solid = done), outline (pending) and hatching (late); the hero band inverts. */
:root{
  --bg:#F4F4F4; --surface:#FFFFFF; --raise:#F7F7F7; --ink:#0A0A0A; --muted:#6B6B6B; --line:#E2E2E2; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -10px rgba(0,0,0,.16);
  --brand:#0A0A0A; --brand-ink:#FFFFFF; --brand-soft:#ECECEC; --amber:#0A0A0A; --amber-soft:#ECECEC;
  --hero:#0A0A0A; --hero-2:#232323; --hero-ink:#FFFFFF; --hero-muted:#A3A3A3; --hero-line:rgba(255,255,255,.14); --hero-fill:rgba(255,255,255,.08);
  --ok:#0A0A0A; --ok-soft:#ECECEC; --warn:#6B6B6B; --warn-soft:#F4F4F4; --bad:#0A0A0A; --bad-soft:#E6E6E6;
  --bar:#BDBDBD;
  --s-lead:#D0D0D0; --s-contactado:#A8A8A8; --s-reunion:#808080; --s-propuesta:#555555; --s-construccion:#2E2E2E; --s-activo:#0A0A0A; --s-pausado:#E3E3E3; --s-perdido:#FFFFFF;
  --f-display:"Bricolage Grotesque","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0E0E0E; --raise:#161616; --ink:#F4F4F4; --muted:#9A9A9A; --line:#262626; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
  --brand:#F4F4F4; --brand-ink:#000000; --brand-soft:#222222; --amber:#F4F4F4; --amber-soft:#222222;
  --hero:#F4F4F4; --hero-2:#FFFFFF; --hero-ink:#000000; --hero-muted:#5E5E5E; --hero-line:rgba(0,0,0,.14); --hero-fill:rgba(0,0,0,.05);
  --ok:#F4F4F4; --ok-soft:#222222; --warn:#9A9A9A; --warn-soft:#161616; --bad:#F4F4F4; --bad-soft:#2A2A2A;
  --bar:#4A4A4A;
  --s-lead:#3A3A3A; --s-contactado:#5C5C5C; --s-reunion:#808080; --s-propuesta:#B0B0B0; --s-construccion:#D6D6D6; --s-activo:#F4F4F4; --s-pausado:#262626; --s-perdido:#000000;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E0E0E; --raise:#161616; --ink:#F4F4F4; --muted:#9A9A9A; --line:#262626; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
  --brand:#F4F4F4; --brand-ink:#000000; --brand-soft:#222222; --amber:#F4F4F4; --amber-soft:#222222;
  --hero:#F4F4F4; --hero-2:#FFFFFF; --hero-ink:#000000; --hero-muted:#5E5E5E; --hero-line:rgba(0,0,0,.14); --hero-fill:rgba(0,0,0,.05);
  --ok:#F4F4F4; --ok-soft:#222222; --warn:#9A9A9A; --warn-soft:#161616; --bad:#F4F4F4; --bad-soft:#2A2A2A;
  --bar:#4A4A4A;
  --s-lead:#3A3A3A; --s-contactado:#5C5C5C; --s-reunion:#808080; --s-propuesta:#B0B0B0; --s-construccion:#D6D6D6; --s-activo:#F4F4F4; --s-pausado:#262626; --s-perdido:#000000;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin:0;flex:1 1 auto;min-width:0}
.mark{width:32px;height:32px;border-radius:9px;background:var(--hero);display:grid;place-items:center;flex:none}
.brand h1{font-family:var(--f-display);font-weight:750;font-size:19px;letter-spacing:-.02em;margin:0;line-height:1.1}
.brand h1.wm{font-size:23px;letter-spacing:-.045em;font-weight:750}
.brand h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.month{display:flex;align-items:center;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:30px;height:30px;border-radius:50%;font-size:17px;color:var(--muted);line-height:1}
.month button:hover{background:var(--surface);color:var(--ink)}
.month span{min-width:126px;text-align:center;font-weight:600;font-size:13px}
.seg{display:flex;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;width:max-content;max-width:100%}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:500;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.seg .count{font-family:var(--f-mono);font-size:11px;background:var(--brand-soft);color:var(--brand);padding:0 6px;border-radius:999px}

main{padding-block:22px 64px;display:grid;gap:18px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 15px;color:var(--muted);font-size:13px}
.banner.bad{border:1.5px solid var(--ink);background:repeating-linear-gradient(-45deg,var(--bad-soft) 0 6px,var(--surface) 6px 12px);color:var(--ink);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-family:var(--f-display);font-weight:650;font-size:17px;letter-spacing:-.01em;margin:0}
.ph .sub{font-size:12px;color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,background .12s,border-color .12s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ok{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.btn.ok:hover{background:var(--ink);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--raise)}
.btn.danger{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ink);color:var(--surface)}
.pill.warn{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill.bad{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:repeating-linear-gradient(-45deg,var(--bad-soft) 0 4px,transparent 4px 8px)}
.pill.bad::before{border-radius:1px;transform:rotate(45deg)}

.av{--h:180;width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:12px;letter-spacing:.02em;background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.av.sm{width:26px;height:26px;font-size:11px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px;color:var(--hero-ink);background:radial-gradient(120% 140% at 100% 0%,var(--hero-2) 0%,var(--hero) 55%);display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.95fr);gap:28px;align-items:center;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,var(--hero-line) 0 1px,transparent 1px 28px);opacity:.35;pointer-events:none;mask-image:linear-gradient(90deg,transparent 30%,#000)}
.hero>*{position:relative;z-index:1;min-width:0}
@media (max-width:900px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero .hk{grid-column:1/-1}}
@media (max-width:520px){.hero{grid-template-columns:auto minmax(0,1fr);padding:18px;gap:16px;border-radius:16px}.ring{width:96px;height:96px}.ring .c b{font-size:22px}.ring .c span{font-size:9px}.hero .big{font-size:30px;margin:4px 0 6px}.hero .goalline{font-size:13px}.hk .v{font-size:16px}.hk>div{padding:11px 12px}}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--f-display);font-size:34px;font-weight:750;letter-spacing:-.03em;line-height:1}
.ring .c span{font-size:11px;color:var(--hero-muted);margin-top:3px}
.hero .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--hero-muted);font-weight:600}
.hero .big{font-family:var(--f-display);font-weight:750;font-size:clamp(38px,6vw,56px);letter-spacing:-.035em;line-height:1;margin:6px 0 8px}
.hero .goalline{color:var(--hero-muted);font-size:14px}
.hero .goalline b{color:var(--hero-ink);font-weight:600}
.hero .hbtn{margin-top:14px;background:var(--hero-fill);border:1px solid var(--hero-line);color:var(--hero-ink);border-radius:10px;padding:7px 12px;font-weight:600;font-size:12px}
.hero .hbtn:hover{background:var(--hero-line)}
.hero .hbtn:disabled{opacity:.5;cursor:not-allowed}
.hero form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.hero input{background:var(--hero-fill);border:1px solid var(--hero-line);border-radius:10px;padding:8px 11px;color:var(--hero-ink);width:150px}
.hero .save{background:var(--hero-ink);color:var(--hero);border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.hk{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--hero-line);border-radius:14px;overflow:hidden;background:var(--hero-fill)}
.hk>div{padding:13px 15px;border-right:1px solid var(--hero-line);border-bottom:1px solid var(--hero-line)}
.hk>div:nth-child(2n){border-right:0}
.hk>div:nth-last-child(-n+2){border-bottom:0}
.hk .v{font-family:var(--f-mono);font-size:19px;font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}
.hk .s{font-size:11px;color:var(--hero-muted)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:880px){.two{grid-template-columns:1fr}}
.list{display:grid}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.empty{color:var(--muted);font-size:13px;padding:14px 0;display:flex;gap:10px;align-items:center}
.empty svg{flex:none}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:600;white-space:nowrap;font-family:var(--f-mono)}
.chip.late{background:var(--ink);color:var(--surface)}

.funnel{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 30px;gap:12px;align-items:center;font-size:13px}
.frow>span:first-child{display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.frow .track{height:8px;background:var(--raise);border-radius:999px;overflow:hidden}
.frow .track i{display:block;height:100%;border-radius:999px;min-width:0;box-shadow:inset 0 0 0 1px var(--ink)}
.frow .n{text-align:right}
@media (max-width:420px){.frow{grid-template-columns:118px minmax(0,1fr) 26px}}
.chart svg{width:100%;height:auto;display:block}

/* pipeline */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:9px 12px 9px 34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.board{overflow-x:auto;padding-bottom:10px;margin-top:16px;scroll-snap-type:x proximity}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;min-width:min-content}
.col{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;scroll-snap-align:start}
.col h3{margin:2px 4px 4px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.col h3 .k{display:flex;gap:7px;align-items:center}
.col h3 .sum{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:11px}
.col .none{font-size:12px;color:var(--muted);text-align:center;padding:16px 6px;border:1px dashed var(--line);border-radius:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px;display:grid;gap:9px;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card .open{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.card .open:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.card select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--raise);font-size:12px;width:100%}

/* cobros */
.progress{display:flex;gap:3px;margin:-4px 0 16px}
.progress i{height:6px;flex:1;border-radius:999px;background:var(--line)}
.progress i.on{background:var(--ink)}
.ptable{width:100%;border-collapse:collapse}
.ptable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptable td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable tbody tr:last-child td{border-bottom:0}
.ptable td.r,.ptable th.r{text-align:right}
.ptable tr.form td{background:var(--raise);border-radius:10px}
.sub2{font-size:11px;color:var(--muted);margin-top:3px}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.inline label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.inline input,.inline select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0}
.tablewrap{overflow-x:auto}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.totals div{background:var(--raise);border-radius:10px;padding:10px 12px}
.totals b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px;margin-top:2px}
@media (max-width:640px){
  .ptable thead{display:none}
  .ptable tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .ptable tbody tr:last-child{border-bottom:0}
  .ptable td{border:0;padding:0}
  .ptable td.hide-m{display:none}
  .ptable tr.form{display:block}
  .ptable tr.form td{display:block;padding:12px}
}

/* import */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
@media (max-width:760px){.how{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.how{grid-template-columns:1fr}}
.how li{counter-increment:s;background:var(--raise);border-radius:12px;padding:12px 13px;font-size:13px;color:var(--muted)}
.how li::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:12px;margin-bottom:8px}
.how b{color:var(--ink)}
.drop{display:grid;place-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;margin-top:14px;background:var(--raise);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop input{display:none}
.drop .ic{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--brand);box-shadow:var(--shadow)}

/* mobile app shell */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bnav button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:4px 0;font-size:10.5px;font-weight:600;color:var(--muted);position:relative;-webkit-tap-highlight-color:transparent}
.bnav .ic{width:46px;height:28px;display:grid;place-items:center;border-radius:999px;transition:background .15s}
.bnav button[aria-current="true"]{color:var(--ink)}
.bnav button[aria-current="true"] .ic{background:var(--ink);color:var(--surface)}
.bnav button:focus-visible .ic{outline:2px solid var(--ink);outline-offset:2px}
.bnav .badge{position:absolute;top:0;left:calc(50% + 9px);min-width:17px;height:17px;border-radius:9px;background:var(--surface);color:var(--ink);font-size:10px;font-family:var(--f-mono);display:grid;place-items:center;padding:0 4px;box-shadow:inset 0 0 0 1.5px var(--ink)}

  <form class="lcard" id="loginForm" novalidate>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const STAGES=[
  {k:'lead',l:'Lead'},{k:'contactado',l:'Contactado'},{k:'reunion',l:'Llamada / reunión'},
  {k:'propuesta',l:'Propuesta enviada'},{k:'construccion',l:'En construcción'},{k:'activo',l:'Cliente activo'},{k:'pausado',l:'Pausado'},{k:'perdido',l:'Perdido'}];
const OPEN=['lead','contactado','reunion','propuesta'];
const stageLabel=k=>(STAGES.find(s=>s.k===k)||{l:k}).l;
const pad=n=>String(n).padStart(2,'0');
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addM=(m,n)=>{const [y,mo]=m.split('-').map(Number);return ymOf(new Date(y,mo-1+n,1))};
const mLabel=(m,short)=>{const [y,mo]=m.split('-').map(Number);const s=new Date(y,mo-1,1).toLocaleDateString('es-ES',short?{month:'short'}:{month:'long',year:'numeric'});return (s.charAt(0).toUpperCase()+s.slice(1)).replace('.','')};
const fmtEur=v=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2}).format(v||0);
const fmtDate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const initials=n=>{const p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};
const hue=n=>{let h=0;for(const ch of String(n||''))h=(h*31+ch.charCodeAt(0))%360;return h};
const av=(n,cls='')=>`<span class="av ${cls}" style="--h:${hue(n)}" aria-hidden="true">${esc(initials(n))}</span>`;
const dot=k=>`<span class="dot" style="background:var(--s-${k})"></span>`;

const S={db:null,user:null,me:null,canWrite:true,clients:[],payments:{},goals:{},month:ymOf(new Date()),tab:'resumen',
  loaded:{clients:false,payments:false,events:false},events:[],users:{},selDay:null,clientId:null,stageFilter:'',contactForm:false,error:null,search:'',payForm:null,goalEdit:false,imp:null};

/* ---------- data helpers ---------- */
const clientById=id=>S.clients.find(c=>c.id===id);
const payKey=(cid,m)=>cid+'_'+m;
const payFor=(cid,m)=>S.payments[payKey(cid,m)];
const feeStartM=c=>c.feeFrom||(c.start?c.start.slice(0,7):'');
const PLANS={proyecto:'Solo proyecto',membresia:'Membresía mensual',cambios:'Por cambios',anual:'Plan anual'};
const planOf=c=>c.planType||((+c.fee||0)>0?'membresia':'');
const planLabel=c=>PLANS[planOf(c)]||'Sin plan elegido';
const DEPOSIT=.3;
const annualCycle=c=>{const d0=c.renewDate||c.start||todayISO();const y0=+d0.slice(0,4);let md=d0.slice(5);if(md==='02-29')md='02-28';let y=y0;while(S.payments[c.id+'_annual_'+y]&&y<y0+40)y++;return {y,date:y+'-'+md}};
const activeFor=m=>S.clients.filter(c=>c.stage==='activo'&&planOf(c)==='membresia'&&(+c.fee||0)>0&&(!feeStartM(c)||feeStartM(c)<=m));
const paysInMonth=m=>Object.values(S.payments).filter(p=>p.month===m);
const collected=m=>paysInMonth(m).reduce((a,p)=>a+(+p.amount||0),0);
const expected=m=>activeFor(m).reduce((a,c)=>a+(+c.fee||0),0);
function dueRows(m){
  const ids=new Set(activeFor(m).map(c=>c.id));
  paysInMonth(m).forEach(p=>{if(!p.kind)ids.add(p.clientId)});
  return [...ids].map(id=>clientById(id)).filter(Boolean).sort((a,b)=>(+a.dueDay||31)-(+b.dueDay||31)||a.name.localeCompare(b.name));
}
function payStatus(c,m){
  if(payFor(c.id,m)) return {k:'ok',l:'Recibido'};
  const cur=ymOf(new Date());
  if(m<cur) return {k:'bad',l:'Atrasado'};
  if(m===cur&&c.dueDay&&new Date().getDate()>+c.dueDay) return {k:'bad',l:'Atrasado'};
  return {k:'warn',l:'Pendiente'};
}

function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast" role="status"></div>';r.firstChild.textContent=msg;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2600)}
async function write(fn,okMsg){
  if(!S.db){toast('Sin conexión con la base de datos');return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    if(e&&e.code==='permission-denied'){toast('No tienes permiso para guardar. Revisa las reglas de Firestore.');return false}
    if(e&&e.code==='invalid_argument'&&S.canWrite!==false){S.canWrite=false;render();toast('Tu acceso es de solo lectura. Pide al propietario permiso de colaborador.')}
    else if(e&&e.code==='quota_exceeded') toast('La base de datos está llena: elimina clientes antiguos.');
    else toast('No se pudo guardar. Inténtalo de nuevo.');
    return false}
}
const ro=()=>S.canWrite===false?'disabled':'';

/* ---------- boot (Firebase) ---------- */
let unsubs=[];
function startData(){
  const db=firebase.firestore();S.db=db;S.error=null;
  const err=what=>e=>{S.error=e&&e.code==='permission-denied'?'Tu cuenta no tiene permiso para ver estos datos. Añade tu email a las reglas de Firestore (mira el README).':'Se perdió la conexión con '+what+'. Recarga la página.';render()};
  unsubs.push(db.collection('clients').onSnapshot(s=>{S.clients=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.clients=true;render()},err('los clientes')));
  unsubs.push(db.collection('payments').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]={id:d.id,...d.data()});S.payments=o;S.loaded.payments=true;render()},err('los cobros')));
  unsubs.push(db.collection('events').onSnapshot(s=>{S.events=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.events=true;render()},err('el calendario')));
  unsubs.push(db.collection('users').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.users=o;hydrateNames()},()=>{}));
  unsubs.push(db.doc('settings/goals').onSnapshot(s=>{S.goals=(s.exists&&s.data().months)||{};render()},()=>{}));
}
function stopData(){unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];S.loaded={clients:false,payments:false,events:false};S.clients=[];S.payments={};S.events=[];S.goals={};S.users={};S.db=null}
const showLogin=()=>{document.getElementById('login').hidden=false;setTimeout(()=>{const e=document.getElementById('l_email');e&&!e.value&&e.focus()},50)};
const hideLogin=()=>{document.getElementById('login').hidden=true};
function authMsg(code){return({'auth/invalid-credential':'Email o contraseña incorrectos.','auth/wrong-password':'Email o contraseña incorrectos.','auth/user-not-found':'Email o contraseña incorrectos.','auth/invalid-email':'Ese email no es válido.','auth/missing-password':'Escribe tu contraseña.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos y vuelve a probar.','auth/network-request-failed':'Sin conexión a internet.','auth/user-disabled':'Esta cuenta está desactivada.'})[code]||('No se pudo entrar ('+code+').')}
function bootFirebase(){
  const cfg=window.NUKLEO_FIREBASE;
  if(!window.firebase){S.error='No se pudo cargar Firebase. Revisa tu conexión y recarga.';render();return}
  if(!cfg||!cfg.apiKey||/^PEGA/.test(cfg.apiKey)){S.error='Falta la configuración de Firebase: rellena config.js (instrucciones en el README).';render();return}
  firebase.initializeApp(cfg);
  try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
  firebase.auth().onAuthStateChanged(u=>{
    if(u){S.me=u.uid;hideLogin();document.getElementById('logout').hidden=false;stopData();startData();render();
      firebase.firestore().doc('users/'+u.uid).set({email:u.email||'',name:u.displayName||(u.email||'').split('@')[0],lastSeen:new Date().toISOString()},{merge:true}).catch(()=>{});}
    else{stopData();S.me=null;document.getElementById('logout').hidden=true;showLogin();render()}
  });
}
document.getElementById('logout').onclick=()=>firebase.auth().signOut();
document.getElementById('forgot').onclick=async()=>{
  const em=document.getElementById('l_email').value.trim(),le=document.getElementById('lerr');
  if(!em){le.className='lerr bad';le.textContent='Escribe tu email arriba y vuelve a pulsar.';return}
  try{await firebase.auth().sendPasswordResetEmail(em);le.className='lerr ok';le.textContent='Te hemos enviado un email para cambiar la contraseña.'}
  catch(e){le.className='lerr bad';le.textContent=authMsg(e.code)}
};

/* ---------- render ---------- */
function render(){
  document.getElementById('mLabel').textContent=mLabel(S.month);
  const pend=S.loaded.clients?dueRows(S.month).filter(c=>!payFor(c.id,S.month)).length:0;
  document.querySelectorAll('#tabs button').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===(S.tab==='cliente'?'clientes':S.tab)));
    if(b.dataset.tab==='cobros')b.innerHTML='Cobros'+(pend?` <span class="count">${pend}</span>`:'');});
  document.getElementById('addClient').disabled=S.canWrite===false;
  const navKey=S.tab==='cliente'?'clientes':S.tab==='revolut'?'cobros':S.tab;
  document.querySelectorAll('#bnav button').forEach(b=>{b.setAttribute('aria-current',String(b.dataset.tab===navKey));
    const old=b.querySelector('.badge');if(old)old.remove();
    if(b.dataset.tab==='cobros'&&pend){const bd=document.createElement('span');bd.className='badge';bd.textContent=pend;b.appendChild(bd)}});
  const fab=document.getElementById('fab');
  fab.hidden=S.canWrite===false||S.tab==='revolut'||S.tab==='calendario';
  fab.setAttribute('aria-label',S.tab==='calendario'?'Nueva reunión':S.tab==='cliente'?'Nueva reunión con este cliente':'Nuevo cliente');
  const main=document.getElementById('main');
  let h='';
  if(S.error) h+=`<div class="banner bad">${esc(S.error)}</div>`;
  else if(S.canWrite===false) h+=`<div class="banner">Estás viendo el panel en modo lectura. Para editar, el propietario debe darte acceso de colaborador o editor.</div>`;
  if(!S.error&&!(S.loaded.clients&&S.loaded.payments&&S.loaded.events)) h+=`<div class="banner">Cargando datos…</div>`;
  else if(!S.error) h+=({resumen:vResumen,pipeline:vPipeline,clientes:vClientes,cliente:vCliente,calendario:vCalendario,cobros:vCobros,revolut:vRevolut}[S.tab])();
  const keep={};main.querySelectorAll('input[id],textarea[id]').forEach(el=>{if(el.type!=='file'&&el.type!=='checkbox'&&el.id!=='search')keep[el.id]=el.value});
  const fid=document.activeElement&&main.contains(document.activeElement)?document.activeElement.id:null;
  const y=window.scrollY;main.innerHTML=h;
  for(const k in keep){const el=document.getElementById(k);if(el&&main.contains(el))el.value=keep[k]}
  if(fid&&fid!=='search'){const el=document.getElementById(fid);if(el)el.focus({preventScroll:true})}
  window.scrollTo(0,y);
  hydrateNames();
}
function hydrateNames(){document.querySelectorAll('[data-uid]').forEach(e=>{const id=e.dataset.uid,u=S.users[id];e.textContent=id===S.me?'ti':(u&&u.name)||'otra persona'})}
const emptyIcon=`<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="5" y="9" width="24" height="18" rx="4" fill="none" stroke="var(--line)" stroke-width="2"/><rect x="9" y="5" width="16" height="4" rx="2" fill="var(--line)"/><path d="M11 18h12" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>`;

function emptyClients(){
  return `<section class="panel" style="display:grid;gap:14px;justify-items:start;padding:28px">
  <div class="drop" style="margin:0;cursor:default;width:auto;padding:0;border:0;background:none"><div class="ic"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 18c.8-3.2 3.2-5 6-5s5.2 1.8 6 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17 6v6M14 9h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div></div>
  <div><h2 style="font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0 0 6px">Añadid vuestro primer cliente</h2>
  <p style="color:var(--muted);max-width:58ch;margin:0">Guarda su contacto, la etapa en la que está y la cuota mensual. Todo lo que añadáis tú y tu compañero aparece aquí al momento.</p></div>
  <button class="btn primary" data-act="new" ${ro()}>Añadir cliente</button></section>`;
}

function ring(col,goal,exp){
  const R=62,C=2*Math.PI*R;const p=goal?Math.min(1,col/goal):0,f=goal?Math.min(1,exp/goal):0;
  return `<div class="ring" role="img" aria-label="${goal?Math.round(col/goal*100)+'% del objetivo':'Sin objetivo'}"><svg viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--hero-line)" stroke-width="12"/>
    ${goal?`<circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--hero-muted)" stroke-opacity=".35" stroke-width="12" stroke-dasharray="${C*f} ${C}" stroke-linecap="round"/>
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--ring)" stroke-width="12" stroke-dasharray="${Math.max(.001,C*p)} ${C}" stroke-linecap="round" style="transition:stroke-dasharray .6s"/>`:''}
  </svg><div class="c"><b>${goal?Math.round(col/goal*100)+'%':'—'}</b><span>${goal?'del objetivo':'sin objetivo'}</span></div></div>`;
}

function vResumen(){
  const m=S.month,goal=+S.goals[m]||0,col=collected(m),exp=expected(m);
  const act=activeFor(m),rows=dueRows(m),pend=rows.filter(c=>!payFor(c.id,m));
  const pendSum=pend.reduce((a,c)=>a+(+c.fee||0),0);
  const openCount=S.clients.filter(c=>OPEN.includes(c.stage)).length;
  let g=`<section class="hero">${ring(col,goal,exp)}<div>
    <div class="lab">Cobrado · ${esc(mLabel(m))}</div>
    <div class="big num" style="font-family:var(--f-display)">${fmtEur(col)}</div>
    <div class="goalline">${goal?`Objetivo <b>${fmtEur(goal)}</b> · faltan <b>${fmtEur(Math.max(0,goal-col))}</b>`:'Aún no habéis fijado el objetivo de este mes'}</div>
    ${goal?`<div class="goalline" style="font-size:12px;margin-top:4px">Si cobráis todas las cuotas: ${fmtEur(exp)} (${Math.round(exp/goal*100)}%)</div>`:''}`;
  if(S.goalEdit) g+=`<form id="goalForm"><input id="goalInput" type="number" min="0" step="50" value="${goal||''}" placeholder="Objetivo en €" aria-label="Objetivo de ${esc(mLabel(m))} en euros" required><button class="save" type="submit">Guardar</button><button class="hbtn" style="margin:0" type="button" data-act="goalCancel">Cancelar</button></form>`;
  else g+=`<button class="hbtn" data-act="goalEdit" ${ro()}>${goal?'Cambiar objetivo':'Fijar objetivo del mes'}</button>`;
  g+=`</div><div class="hk">
    <div><div class="lab">Pendiente</div><div class="v">${fmtEur(pendSum)}</div><div class="s">${pend.length} cliente${pend.length===1?'':'s'}</div></div>
    <div><div class="lab">Cuotas / mes</div><div class="v">${fmtEur(exp)}</div><div class="s">ingreso recurrente</div></div>
    <div><div class="lab">Activos</div><div class="v">${act.length}</div><div class="s">clientes pagando</div></div>
    <div><div class="lab">Pipeline</div><div class="v">${openCount}</div><div class="s">oportunidades abiertas</div></div>
  </div></section>`;
  if(!S.clients.length) return g+emptyClients();

  // chart
  const months=[...Array(6)].map((_,i)=>addM(m,i-5));
  const data=months.map(mm=>({m:mm,c:collected(mm),g:+S.goals[mm]||0}));
  const max=Math.max(1,...data.map(d=>Math.max(d.c,d.g)))*1.12;
  const W=560,H=210,pl=6,pb=28,pt=18,bw=(W-pl*2)/6;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cobrado frente a objetivo, últimos 6 meses"><defs><linearGradient id="gb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--brand)" stop-opacity=".55"/></linearGradient></defs>`;
  [0.25,0.5,0.75].forEach(t=>svg+=`<line x1="${pl}" x2="${W-pl}" y1="${pt+(H-pt-pb)*t}" y2="${pt+(H-pt-pb)*t}" stroke="var(--line)" stroke-dasharray="2 4"/>`);
  svg+=`<line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>`;
  data.forEach((d,i)=>{const cx=pl+i*bw+bw/2,bwid=Math.min(46,bw*0.5);const cur=d.m===m;const hgt=Math.max(0,H-pb-y(d.c));

    svg+=`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="12" fill="${cur?'var(--ink)':'var(--muted)'}" font-weight="${cur?700:400}">${esc(mLabel(d.m,true))}</text>`;});

const CAL_ICON=`<svg width="15" height="15" viewBox="0 0 15 15"><rect x="1.8" y="2.8" width="11.4" height="10.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.8 6.3h11.4M5 1.3v3M10 1.3v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
const EVTYPES=['Reunión','Llamada','Seguimiento','Demo','Otro'];
function dayItems(m){
  const out={},push=(d,x)=>(out[d]=out[d]||[]).push(x);
  S.events.forEach(e=>{if(e.date&&e.date.slice(0,7)===m)push(e.date,{k:'ev',id:e.id,time:e.time||'',end:e.end||'',title:e.title,sub:[e.type,clientById(e.clientId)?.name,e.place].filter(Boolean).join(' · ')})});
  S.clients.forEach(c=>{if(c.nextDate&&c.nextDate.slice(0,7)===m&&c.stage!=='perdido')push(c.nextDate,{k:'act',id:c.id,time:'',title:(c.nextAction||'Seguimiento')+' · '+c.name,sub:stageLabel(c.stage)})});
  const [y,mo]=m.split('-').map(Number),dim=new Date(y,mo,0).getDate();
  activeFor(m).forEach(c=>{if(c.dueDay&&!payFor(c.id,m))push(m+'-'+pad(Math.min(+c.dueDay,dim)),{k:'due',id:c.id,time:'',title:'Cobro · '+c.name,sub:fmtEur(c.fee)})});
  S.clients.filter(c=>planOf(c)==='anual'&&!['perdido','lead'].includes(c.stage)).forEach(c=>{const cy=annualCycle(c);if(cy.date.slice(0,7)===m)push(cy.date,{k:'due',id:c.id,time:'',title:'Renovación anual · '+c.name,sub:fmtEur(c.annualFee)})});
  const o={ev:0,act:1,due:2};
  Object.values(out).forEach(l=>l.sort((a,b)=>o[a.k]-o[b.k]||(a.time||'99').localeCompare(b.time||'99')));
  return out;
}
function vCalendario(){
  const m=S.month,[y,mo]=m.split('-').map(Number),t=todayISO();
  const off=(new Date(y,mo-1,1).getDay()+6)%7,dim=new Date(y,mo,0).getDate();
  if(!S.selDay||S.selDay.slice(0,7)!==m)S.selDay=t.slice(0,7)===m?t:m+'-01';
  const items=dayItems(m);let cells='';
  for(let i=0;i<off;i++)cells+='<div class="cell out" aria-hidden="true"></div>';
  for(let d=1;d<=dim;d++){const ds=m+'-'+pad(d),li=items[ds]||[],wd=(off+d-1)%7;
    cells+=`<button class="cell ${wd>4?'wk':''} ${ds===t?'today':''} ${ds===S.selDay?'sel':''}" data-act="day" data-d="${ds}" aria-pressed="${ds===S.selDay}" aria-label="${d}, ${li.length} apuntado${li.length===1?'':'s'}"><span class="d">${d}</span>
      <span class="evs">${li.slice(0,3).map(x=>`<span class="it ${x.k}">${x.time?`<b>${esc(x.time)}</b> `:''}${esc(x.title)}</span>`).join('')}${li.length>3?`<span class="more">+${li.length-3} más</span>`:''}</span>
      <span class="dots">${li.slice(0,4).map(x=>`<i class="${x.k}"></i>`).join('')}</span></button>`}
  const tail=(7-(off+dim)%7)%7;for(let i=0;i<tail;i++)cells+='<div class="cell out" aria-hidden="true"></div>';
  const sel=items[S.selDay]||[];const [sy,sm,sd]=S.selDay.split('-').map(Number);
  let dn=new Date(sy,sm-1,sd).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});dn=dn.charAt(0).toUpperCase()+dn.slice(1);
  const lbl={ev:'Todo el día',act:'Acción',due:'Cobro'};

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';const delim=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true; else if(ch===delim){row.push(f);f=''} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''} else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function parseAmount(s){s=String(s||'').replace(/[^\d,.\-]/g,'');if(s.includes(',')&&s.includes('.')){s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}else if(s.includes(','))s=s.replace(',','.');return parseFloat(s)}
function parseDate(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}return null}
function findCol(h,names){const n=h.map(norm);for(const x of names){const i=n.indexOf(norm(x));if(i>=0)return i}for(const x of names){const i=n.findIndex(v=>v.includes(norm(x)));if(i>=0)return i}return -1}
function matchClient(desc,amount){
  const d=' '+norm(desc)+' ';
  const cands=S.clients.filter(c=>c.stage!=='perdido').map(c=>{const keys=[c.payer,c.name].filter(Boolean).map(norm).filter(Boolean);
    let hit=keys.some(k=>d.includes(' '+k+' '));
    if(!hit)hit=keys.some(k=>{const tk=k.split(' ').filter(w=>w.length>2);return tk.length>=2&&tk.every(w=>d.includes(' '+w+' '))});
    return hit?{c,amt:Math.abs((+c.fee||0)-amount)<0.01}:null}).filter(Boolean);
  cands.sort((a,b)=>(b.amt-a.amt)||(b.c.stage==='activo')-(a.c.stage==='activo'));
  return cands[0]?cands[0].c:null;
}
function handleFile(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const rows=parseCSV(String(r.result));if(rows.length<2)throw 0;
    const h=rows[0];
    const iAmt=findCol(h,['Amount','Importe','Cantidad']),iDesc=findCol(h,['Description','Descripción','Descripcion','Concepto']);
    const iDate=findCol(h,['Completed Date','Fecha de finalización','Fecha de finalizacion','Fecha completada','Started Date','Fecha de inicio','Fecha']);
    const iState=findCol(h,['State','Estado']),iCur=findCol(h,['Currency','Divisa','Moneda']);
    if(iAmt<0||iDesc<0||iDate<0){S.imp={error:'No reconozco las columnas de este archivo. Asegúrate de exportar el extracto de Revolut en formato CSV (Excel).'};render();return}
    const items=[];
    rows.slice(1).forEach(row=>{
      const amount=parseAmount(row[iAmt]);if(!(amount>0))return;
      const st=iState>=0?norm(row[iState]):'';if(st&&!/(complet|finaliz)/.test(st))return;
      const date=parseDate(row[iDate]);if(!date)return;
      const desc=row[iDesc]||'';const c=matchClient(desc,amount);const month=date.slice(0,7);
      const already=!!(c&&payFor(c.id,month));
      items.push({date,month,desc,amount,cur:iCur>=0?row[iCur]:'EUR',clientId:c?c.id:'',already,sel:!!c&&!already});
    });
    S.imp={name:file.name,items};render();
  }catch(e){S.imp={error:'No se pudo leer el archivo. Exporta el extracto de Revolut como CSV y vuelve a intentarlo.'};render()}};
  r.readAsText(file);
}

  ${I.items.map((x,i)=>{const c=clientById(x.clientId);const diff=c&&c.fee&&Math.abs(c.fee-x.amount)>=0.01;
    return `<tr><td><input type="checkbox" aria-label="Incluir" data-act="impSel" data-i="${i}" ${x.sel?'checked':''} ${(!x.clientId||x.already)?'disabled':''}></td>
    <td class="num">${fmtDate(x.date)}</td><td style="max-width:280px;overflow:hidden;text-overflow:ellipsis">${esc(x.desc)}</td>
    <td class="r num">${fmtEur(x.amount)}${x.cur&&x.cur!=='EUR'?' '+esc(x.cur):''}${diff?`<div class="sub2" style="color:var(--ink);font-weight:600">cuota ${fmtEur(c.fee)}</div>`:''}</td>
    <td><select data-act="impClient" data-i="${i}" aria-label="Cliente" style="border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--raise);max-width:180px">${opts(x.clientId)}</select></td>

  </tbody></table></div>
  <div class="toolbar" style="margin-top:16px"><button class="btn primary" data-act="impApply" ${nSel&&S.canWrite!==false?'':'disabled'}>Marcar ${nSel} como recibido${nSel===1?'':'s'}</button><button class="btn ghost" data-act="impClear">Descartar archivo</button>

    if(ok){S.contactForm=false;render()}return}
  if(f.id==='noteForm'){const c=clientById(S.clientId);if(!c)return;const ta=f.elements.note;const txt=(ta.value||'').trim();if(!txt)return;
    const log=[...(c.log||[]),{at:new Date().toISOString(),by:S.me||null,text:txt.slice(0,2000)}].slice(-200);
    if(await write(()=>S.db.doc('clients/'+c.id).update({log}),'Nota guardada')){const n=document.getElementById('n_text');if(n)n.value=''}return}
  if(f.id==='eventForm'){const id=f.dataset.id;const d={};
    ['title','type','date','time','end','clientId','place','owner','notes'].forEach(k=>d[k]=(f.elements[k].value||'').trim());
    if(!d.title||!d.date)return;d.updatedAt=new Date().toISOString();
    const ok=id?await write(()=>S.db.doc('events/'+id).update(d),'Evento actualizado'):await write(()=>S.db.collection('events').add({...d,createdAt:d.updatedAt,createdBy:S.me||null}),'Evento guardado');
    if(ok){closeDrawer();if(S.tab==='calendario'){S.month=d.date.slice(0,7);S.selDay=d.date;render()}}return}
  if(f.id==='clientForm'){const id=f.dataset.id;const d={};
    ['name','contact','stage','plan','planType','renewDate','start','owner','payer','nextAction','nextDate','notes','company','taxId','sector','web','address','feeFrom'].forEach(k=>d[k]=(f.elements[k].value||'').trim());
    d.fee=parseFloat(f.elements.fee.value)||0;d.annualFee=parseFloat(f.elements.annualFee.value)||0;d.setupPrice=parseFloat(f.elements.setupPrice.value)||0;d.dueDay=parseInt(f.elements.dueDay.value)||null;d.updatedAt=new Date().toISOString();
    if(!d.name)return;
    let nid=null;
    const ok=id?await write(()=>S.db.doc('clients/'+id).update(d),'Cambios guardados'):await write(async()=>{const r=await S.db.collection('clients').add({...d,createdAt:d.updatedAt,createdBy:S.me||null});nid=r.id},'Cliente añadido');
    if(ok){closeDrawer();if(nid)openAccount(nid)}return}
});
render();
bootFirebase();
</script>
</body>
</html>
